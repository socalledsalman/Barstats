name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bundle Offline Fonts (graceful fallback)
        run: |
          mkdir -p www/fonts
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@latest/latin-wght-normal.woff2" -o www/fonts/inter.woff2 || true
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/geist:vf@latest/latin-wght-normal.woff2" -o www/fonts/geist.woff2 || true
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans:vf@latest/latin-wght-normal.woff2" -o www/fonts/jakarta.woff2 || true
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono:vf@latest/latin-wght-normal.woff2" -o www/fonts/mono.woff2 || true

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icon & AMOLED Splash Screen
        run: |
          if [ -d "assets" ]; then
            npx capacitor-assets generate --android \
              --iconBackgroundColor '#000000' \
              --iconBackgroundColorDark '#000000' \
              --splashBackgroundColor '#000000' \
              --splashBackgroundColorDark '#000000'
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      -       - name: Patch Android Safe-Area (fitsSystemWindows) & Version Code
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          LAYOUT="android/app/src/main/res/layout/activity_main.xml"
          if [ -f "$LAYOUT" ]; then
            sed -i 's/android:layout_height="match_parent"/android:layout_height="match_parent" android:fitsSystemWindows="true"/' "$LAYOUT"
          fi

          VER_CODE=$((100 + RUN_NUM))
          GRADLE="android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode $VER_CODE/" "$GRADLE"
          sed -i 's/versionName "[^"]*"/versionName "2.0.'"$RUN_NUM"'"/' "$GRADLE"
          echo "Configured versionCode=$VER_CODE versionName=2.0.$RUN_NUM"
          

      - name: Build & Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release
          chmod +x android/gradlew

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building signed upgradable Release APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            (cd android && ./gradlew assembleRelease)

            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS/zipalign" -v -p 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk \
              release/Barstats-aligned.apk

            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out release/Barstats.apk \
              release/Barstats-aligned.apk

            rm -f release.keystore release/Barstats-aligned.apk
            echo "Signed release APK ready!"
          else
            echo "::warning::Signing secrets not set. Falling back to Debug APK (add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in repo Secrets for in-place updates)."
            (cd android && ./gradlew assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk release/Barstats.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barstats-APK
          path: release/Barstats.apk

      - name: Publish GitHub Release (on version tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Barstats.apk
          generate_release_notes: true
