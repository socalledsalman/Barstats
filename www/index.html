<!DOCTYPE html>
<html lang="en" data-surface="amoled" data-font="inter">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Barstats</title>
<style>
  /* Bundled Offline Fonts (populated during APK build, graceful fallback on web) */
  @font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Geist'; src: url('fonts/geist.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('fonts/jakarta.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/mono.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }

  :root {
    --radius: 14px;
    --radius-sm: 10px;
    --nav-h: 62px;
    --header-h: 54px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.14);
    --accent-fg: #ffffff;
    --font-ui: 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  [data-font="system"]  { --font-ui: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [data-font="inter"]   { --font-ui: 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [data-font="geist"]   { --font-ui: 'Geist', 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif; }
  [data-font="jakarta"] { --font-ui: 'Plus Jakarta Sans', 'Inter', 'Noto Sans Devanagari', -apple-system, sans-serif; }
  [data-font="mono"]    { --font-ui: 'JetBrains Mono', 'Noto Sans Devanagari', ui-monospace, monospace; }

  /* Surfaces */
  [data-surface="light"] {
    --bg: #f6f7f9;
    --card: #ffffff;
    --card-2: #f0f2f5;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e4e7ec;
    --nav-bg: rgba(255, 255, 255, 0.94);
    --modal-bg: #ffffff;
    --input-bg: #f8fafc;
  }
  [data-surface="dark"] {
    --bg: #0c0f14;
    --card: #151922;
    --card-2: #1d2330;
    --text: #f3f5f8;
    --muted: #8a94a6;
    --border: #252c3a;
    --nav-bg: rgba(12, 15, 20, 0.94);
    --modal-bg: #151922;
    --input-bg: #0c0f14;
  }
  [data-surface="amoled"] {
    --bg: #000000;
    --card: #0c0e12;
    --card-2: #151820;
    --text: #f5f7fa;
    --muted: #7d8594;
    --border: #1e222b;
    --nav-bg: rgba(0, 0, 0, 0.96);
    --modal-bg: #0c0e12;
    --input-bg: #050608;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font-ui); font-size: 14.5px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .mono, .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }

  svg.ic {
    width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0; display: inline-block; vertical-align: middle;
  }
  svg.ic-sm { width: 15px; height: 15px; }
  svg.ic-lg { width: 22px; height: 22px; }

  /* App Shell */
  .app-shell {
    display: flex; flex-direction: column;
    width: 100%; height: 100%; height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* Header */
  .topbar {
    height: var(--header-h); min-height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-logo { width: 24px; height: 24px; color: var(--accent); flex-shrink: 0; display: block; }
  .brand-title { font-size: 17px; font-weight: 700; letter-spacing: -0.35px; }
  .brand-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.94); }

  /* Horizontal Swipe Pages Track */
  .pages-track {
    flex: 1; display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .pages-track::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%; width: 100%; min-width: 100%; height: 100%; height: 100dvh;
    overflow-y: auto; overflow-x: hidden;
    scroll-snap-align: start; scroll-snap-stop: always;
    padding: 18px 18px 34px;
    -webkit-overflow-scrolling: touch;
  }

  /* Bottom Navigation (3 minimal tabs) */
  .bottom-nav {
    height: var(--nav-h); min-height: var(--nav-h);
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--nav-bg);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
    z-index: 20;
  }
  .nav-item {
    border: none; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; font-size: 10.5px; font-weight: 600; cursor: pointer;
    position: relative; padding: 6px 2px; font-family: inherit;
    transition: color 0.16s ease;
  }
  .nav-item svg.ic { width: 19px; height: 19px; stroke-width: 1.7; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active svg.ic { stroke-width: 2.1; }
  .nav-item.active::before {
    content: ""; position: absolute; top: 0; left: 30%; right: 30%;
    height: 2.5px; border-radius: 0 0 3px 3px; background: var(--accent);
  }

  /* Cards & Helpers */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 15px; margin-bottom: 16px;
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 18px 2px 10px;
  }
  .section-head:first-child { margin-top: 2px; }
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.75px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .empty-state { text-align: center; padding: 26px 12px; color: var(--muted); font-size: 13px; }

  /* Buttons, Chips & Segmented Control */
  .btn {
    border: none; border-radius: 10px; padding: 10px 14px; font-family: inherit;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-soft { background: var(--accent-soft); color: var(--accent); }
  .btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(239, 68, 68, 0.14); color: #ef4444; }
  .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
  .btn-xs { padding: 4px 8px; font-size: 11px; border-radius: 7px; }
  .btn-full { width: 100%; }
  .btn:active { transform: scale(0.97); }

  .seg-ctrl {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--card); border: 1px solid var(--border);
    padding: 3px; border-radius: 11px; margin-bottom: 14px;
  }
  .seg-ctrl.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .seg-btn {
    border: none; background: transparent; color: var(--muted); font-family: inherit;
    padding: 7px 6px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .seg-btn.active { background: var(--accent); color: var(--accent-fg); }

  .chip-row {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
    scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  /* Hairline Lists */
  .hairline-list { border-top: 1px solid var(--border); }
  .hairline-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 2px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .hairline-row:active { opacity: 0.72; }
  .hairline-row.ss-linked {
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }

  /* Empty Hero Train Page */
  .train-hero {
    min-height: calc(100% - 10px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 20px 6px 40px;
  }
  .hero-date {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px;
  }
  .hero-cta {
    width: 100%; max-width: 290px;
    padding: 20px 24px; border-radius: 18px;
    font-size: 16.5px; font-weight: 700; letter-spacing: -0.2px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  .hero-sub-links {
    display: flex; align-items: center; gap: 18px; margin-top: 22px;
  }
  .text-link {
    background: none; border: none; color: var(--muted); font-family: inherit;
    font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 4px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .text-link:active { color: var(--text); }

  /* Live Dot */
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #10b981;
    display: inline-block; flex-shrink: 0;
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }

  /* Snapshot Bar */
  .snapshot-bar {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 12px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--border); margin-bottom: 14px;
  }
  .snap-cell { text-align: center; }
  .snap-cell + .snap-cell { border-left: 1px solid var(--border); }
  .snap-val { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .snap-lbl { font-size: 10.5px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }

  /* Callout */
  .callout-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 13px; border-radius: 11px; margin-bottom: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); font-size: 12.5px;
  }

  /* 12-Week Consistency Heatmap */
  .heatmap-wrap {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px;
    margin-top: 10px;
  }
  .hm-col { display: flex; flex-direction: column; gap: 4px; }
  .hm-cell {
    aspect-ratio: 1; border-radius: 3px;
    background: var(--card-2); border: 1px solid var(--border);
    cursor: pointer; transition: transform 0.1s ease;
  }
  .hm-cell.lvl-1 { background: var(--accent); opacity: 0.35; border-color: transparent; }
  .hm-cell.lvl-2 { background: var(--accent); opacity: 0.65; border-color: transparent; }
  .hm-cell.lvl-3 { background: var(--accent); opacity: 1; border-color: transparent; }
  .hm-cell.in-range { outline: 1px solid rgba(255,255,255,0.22); outline-offset: -1px; }
  .hm-cell.today { outline: 1.5px solid var(--text); outline-offset: 0px; }
  .hm-cell:active { transform: scale(0.88); }

  /* Trend Bars */
  .trend-bars {
    display: flex; align-items: flex-end; gap: 6px;
    height: 110px; padding-top: 14px;
  }
  .t-col {
    flex: 1; min-width: 0; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px;
  }
  .t-bar-track {
    width: 100%; max-width: 28px; flex: 1;
    display: flex; align-items: flex-end;
    background: var(--card-2); border-radius: 6px; overflow: hidden;
  }
  .t-bar-fill {
    width: 100%; background: var(--accent); border-radius: 6px 6px 0 0;
    min-height: 2px; transition: height 0.25s ease;
  }
  .t-lbl { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  /* Muscle Set Bars */
  .progress-track { width: 100%; height: 7px; border-radius: 999px; background: var(--card-2); overflow: hidden; margin-top: 5px; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.25s ease; }
  .cat-bar-row { margin-bottom: 11px; }
  .cat-bar-row:last-child { margin-bottom: 0; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .badge-w { background: rgba(245, 158, 11, 0.16); color: #f59e0b; }
  .badge-d { background: rgba(168, 85, 247, 0.16); color: #a855f7; }
  .badge-f { background: rgba(239, 68, 68, 0.16); color: #ef4444; }
  .badge-ss { background: var(--accent-soft); color: var(--accent); }
  .badge-up { background: rgba(16, 185, 129, 0.16); color: #10b981; }

  /* Focus Mode Workout Overlay */
  .focus-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
    transform: translateY(100%); transition: transform 0.22s ease;
    pointer-events: none;
  }
  .focus-overlay.open { transform: translateY(0); pointer-events: auto; }
  .focus-body {
    flex: 1; overflow-y: auto; padding: 16px 16px 110px;
    -webkit-overflow-scrolling: touch;
  }
  .unit-pill {
    padding: 6px 10px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 11.5px; font-weight: 700; font-family: var(--font-mono); cursor: pointer;
  }

  /* Exercise Logger Block */
  .ex-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
  }
  .ex-block.ss-linked {
    border-left: 3px solid var(--accent);
  }
  .ex-anim-btn {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--card-2); border: 1px solid var(--border);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; padding: 0;
  }

  /* Micro-animations */
  @keyframes animPress { 0%,100% { transform: translateY(3px); } 50% { transform: translateY(-3px); } }
  @keyframes animSquat { 0%,100% { transform: translateY(-2px); } 50% { transform: translateY(4px); } }
  @keyframes animPull  { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
  @keyframes animHinge { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
  @keyframes animCurl  { 0%,100% { transform: rotate(16deg); } 50% { transform: rotate(-28deg); } }
  @keyframes animCore  { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.82); } }
  .anim-press { animation: animPress 2s ease-in-out infinite; }
  .anim-squat { animation: animSquat 2.2s ease-in-out infinite; }
  .anim-pull  { animation: animPull 2s ease-in-out infinite; }
  .anim-hinge { transform-origin: 12px 17px; animation: animHinge 2.2s ease-in-out infinite; }
  .anim-curl  { transform-origin: 10px 15px; animation: animCurl 1.9s ease-in-out infinite; }
  .anim-core  { transform-origin: center; animation: animCore 2s ease-in-out infinite; }
  .no-anim *  { animation: none !important; }

  /* Explicit W / D / F Tag Pills */
  .tag-pills { display: flex; align-items: center; gap: 5px; }
  .tag-pill {
    width: 26px; height: 24px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--card-2); color: var(--muted);
    font-size: 11px; font-weight: 700; font-family: var(--font-mono);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .tag-pill.active-W { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; color: #f59e0b; }
  .tag-pill.active-D { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: #a855f7; }
  .tag-pill.active-F { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }

  /* Stepper Controls */
  .stepper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 12px; }
  .stepper-box { display: flex; align-items: center; gap: 5px; }
  .step-btn {
    width: 34px; height: 38px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card-2); color: var(--text);
    font-size: 17px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .step-btn:active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .step-input {
    width: 100%; min-width: 0; height: 38px; text-align: center;
    border-radius: 9px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text);
    font-family: var(--font-mono); font-size: 15px; font-weight: 700; outline: none;
  }
  .step-input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 500; }
  .step-input:focus { border-color: var(--accent); }

  /* Logged Set Row */
  .logged-set-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 6px; border-bottom: 1px dashed var(--border);
    font-size: 13.5px; cursor: pointer;
  }
  .logged-set-row:last-child { border-bottom: none; }
  .logged-set-row:active { background: var(--card-2); border-radius: 8px; }

  /* Floating Rest Timer Pill */
  .rest-pill {
    position: fixed; left: 16px; right: 16px;
    bottom: calc(16px + var(--safe-bottom));
    z-index: 75;
    background: var(--card); border: 1px solid var(--accent);
    border-radius: 14px; padding: 10px 12px;
    box-shadow: var(--shadow);
    display: none; flex-direction: column; gap: 6px;
  }
  .rest-pill.show { display: flex; }
  .rest-bar { width: 100%; height: 3px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
  .rest-bar-fill { height: 100%; background: var(--accent); transition: width 0.25s linear; }

  /* PR Micro-Toast & Confetti */
  .pr-toast {
    position: fixed; top: calc(14px + var(--safe-top)); left: 50%;
    transform: translate(-50%, -160%);
    opacity: 0; visibility: hidden;
    z-index: 150;
    background: var(--card); border: 1px solid var(--accent);
    border-radius: 999px; padding: 9px 16px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; box-shadow: var(--shadow);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, visibility 0.2s ease;
    white-space: nowrap; pointer-events: none;
  }
  .pr-toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

  /* Guaranteed AMOLED Splash Overlay (works on all Android 12+ devices) */
  .app-splash {
    position: fixed
