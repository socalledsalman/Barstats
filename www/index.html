        <button class="seg-btn ${libTab==="templates"?"active":""}" data-lt="templates">${esc(t("templates"))}</button>
      </div>
      ${contentHtml}
    `;

    el.querySelectorAll("[data-lt]").forEach(b => {
      b.onclick = () => { libTab = b.dataset.lt; renderLibrary(); };
    });
    if (libTab === "exercises") {
      const inp = el.querySelector("#libSearchInp");
      inp.oninput = e => { libSearch = e.target.value; renderLibrary(); };
      el.querySelector("#libNewExBtn").onclick = () => openCreateExerciseModal("", "Chest", () => closeModal());
      el.querySelectorAll("[data-lm]").forEach(c => {
        c.onclick = () => { libMuscle = c.dataset.lm; renderLibrary(); };
      });
      el.querySelectorAll("[data-lib-ex]").forEach(r => {
        r.onclick = () => openLiftDrilldown(r.dataset.libEx);
      });
    } else {
      el.querySelector("#newTplBtn").onclick = openNewTemplateModal;
      el.querySelectorAll("[data-run-tpl]").forEach(b => {
        b.onclick = () => {
          const tp = state.templates.find(x => x.id === b.dataset.runTpl);
          if (tp) startNewSession(tp.name, tp.exercises);
        };
      });
      el.querySelectorAll("[data-del-tpl]").forEach(b => {
        b.onclick = () => {
          state.templates = state.templates.filter(x => x.id !== b.dataset.delTpl);
          saveState();
          renderLibrary();
        };
      });
    }
  }

  function openNewTemplateModal() {
    let tplName = "";
    let picked = [];
    function renderM() {
      modalContent.innerHTML = `
        <div style="font-size:16px;font-weight:700;margin-bottom:10px">${esc(t("newTplTitle"))}</div>
        <div class="field"><label>${esc(t("tplName"))}</label><input class="input" id="tplNameInp" value="${esc(tplName)}" placeholder="${esc(t("tplPlaceholder"))}" /></div>
        <div class="field">
          <label>${esc(t("selectEx"))} (${picked.length})</label>
          <div class="hairline-list" style="max-height:38vh;overflow-y:auto">
            ${state.exercises.map(e => {
              const on = picked.includes(e.id);
              return `<div class="hairline-row" data-tp-ex="${e.id}">
                <div><div style="font-weight:600">${esc(e.name)}</div><div class="muted">${esc(mLabel(e.muscle))}</div></div>
                <span class="badge ${on ? "badge-up" : ""}" style="${on ? "" : "color:var(--muted)"}">${on ? "✓" : "+"}</span>
              </div>`;
            }).join("")}
          </div>
        </div>
        <div class="grid-2" style="margin-top:10px">
          <button class="btn btn-ghost" id="cancelTplBtn">${esc(t("cancel"))}</button>
          <button class="btn btn-primary" id="saveTplBtn">${esc(t("save"))}</button>
        </div>
      `;
      modalContent.querySelector("#tplNameInp").oninput = e => { tplName = e.target.value; };
      modalContent.querySelectorAll("[data-tp-ex]").forEach(r => {
        r.onclick = () => {
          const id = r.dataset.tpEx;
          picked = picked.includes(id) ? picked.filter(x => x !== id) : [...picked, id];
          renderM();
        };
      });
      modalContent.querySelector("#cancelTplBtn").onclick = closeModal;
      modalContent.querySelector("#saveTplBtn").onclick = () => {
        if (!tplName.trim() || !picked.length) return;
        state.templates.push({ id: uid("tpl"), name: tplName.trim(), exercises: picked });
        saveState();
        closeModal();
        renderLibrary();
      };
    }
    modalBackdrop.classList.add("open");
    renderM();
  }

  /* ==================== SETTINGS DRAWER ==================== */
  const ACCENT_PRESETS = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#a855f7", "#ec4899", "#06b6d4", "#f97316"];

  function renderSettings() {
    const s = state.settings;
    const body = document.getElementById("settingsBody");
    body.innerHTML = `
      <div class="section-title" style="margin-bottom:8px">${esc(t("language"))}</div>
      <div class="seg-ctrl" style="margin-bottom:16px">
        <button class="seg-btn ${s.lang==="en"?"active":""}" data-set-lang="en">English</button>
        <button class="seg-btn ${s.lang==="hi"?"active":""}" data-set-lang="hi">हिन्दी</button>
      </div>

      <div class="section-title" style="margin-bottom:8px">${esc(t("surface"))}</div>
      <div class="grid-3" style="margin-bottom:16px">
        ${[["amoled",t("amoled")],["dark",t("dark")],["light",t("light")]].map(([v,lbl]) =>
          `<button class="theme-btn ${s.surface===v?"active":""}" data-set-surf="${v}">${esc(lbl)}</button>`
        ).join("")}
      </div>

      <div class="section-title" style="margin-bottom:8px">${esc(t("typography"))}</div>
      <div class="chip-row" style="margin-bottom:16px">
        ${[["inter","Inter"],["geist","Geist"],["jakarta","Jakarta"],["mono","Mono"],["system","System"]].map(([v,lbl]) =>
          `<button class="chip ${s.font===v?"active":""}" data-set-font="${v}">${lbl}</button>`
        ).join("")}
      </div>

      <div class="card">
        <div class="section-title" style="margin-bottom:6px">${esc(t("accentColor"))}</div>
        <div class="wheel-wrap">
          <canvas id="colorWheelCanvas" width="150" height="150"></canvas>
          <div class="preset-dots">
            ${ACCENT_PRESETS.map(c => `<div class="preset-dot ${s.accent.toLowerCase()===c?"active":""}" style="background:${c}" data-preset-c="${c}"></div>`).join("")}
          </div>
          <div class="hex-row">
            <div class="hex-preview" id="hexPreview" style="background:${esc(s.accent)}"></div>
            <input class="input mono" id="hexInput" value="${esc(s.accent)}" maxlength="7" />
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-bottom:10px">${esc(t("training"))}</div>
        <div class="row-between" style="margin-bottom:14px">
          <div><div style="font-weight:600">${esc(t("weightUnit"))}</div><div class="muted">${esc(t("weightUnitSub"))}</div></div>
          <div class="seg-ctrl" style="margin:0;width:116px">
            <button class="seg-btn ${s.unit==="kg"?"active":""}" data-set-unit="kg">kg</button>
            <button class="seg-btn ${s.unit==="lbs"?"active":""}" data-set-unit="lbs">lbs</button>
          </div>
        </div>

        <div style="margin-bottom:14px">
          <div class="row-between">
            <span style="font-weight:600">${esc(t("defaultRest"))}</span>
            <span class="mono" id="restSliderVal" style="font-weight:700;color:var(--accent)">${formatRest(s.restSec)}</span>
          </div>
          <input type="range" class="accent-slider" id="restSlider" min="5" max="300" step="5" value="${s.restSec}" />
          <div class="row-between muted mono" style="font-size:10.5px"><span>5s</span><span>5m</span></div>
        </div>

        <div class="row-between" style="margin-bottom:12px">
          <div><div style="font-weight:600">${esc(t("restChime"))}</div><div class="muted">${esc(t("restChimeSub"))}</div></div>
          <div class="switch ${s.chime?"on":""}" data-toggle-s="chime"></div>
        </div>
        <div class="row-between" style="margin-bottom:12px">
          <div><div style="font-weight:600">${esc(t("exAnims"))}</div><div class="muted">${esc(t("exAnimsSub"))}</div></div>
          <div class="switch ${s.animations?"on":""}" data-toggle-s="animations"></div>
        </div>
        <div class="row-between">
          <div><div style="font-weight:600">${esc(t("perfCallouts"))}</div><div class="muted">${esc(t("perfCalloutsSub"))}</div></div>
          <div class="switch ${s.callouts?"on":""}" data-toggle-s="callouts"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-bottom:10px">${esc(t("dataBackup"))}</div>
        <div class="grid-2" style="margin-bottom:8px">
          <button class="btn btn-soft btn-sm" id="exportJsonBtn">${esc(t("exportJson"))}</button>
          <button class="btn btn-soft btn-sm" id="exportCsvBtn">${esc(t("exportCsv"))}</button>
        </div>
        <div class="grid-2" style="margin-bottom:8px">
          <button class="btn btn-ghost btn-sm" id="copyJsonBtn">${esc(t("copyJson"))}</button>
          <button class="btn btn-ghost btn-sm" id="importFileBtn">${esc(t("importFile"))}</button>
        </div>
        <div class="grid-2" style="margin-bottom:10px">
          <button class="btn btn-ghost btn-sm" id="pasteJsonBtn">${esc(t("pasteJson"))}</button>
          <button class="btn btn-ghost btn-sm" id="seedDemoBtn">${esc(t("loadDemo"))}</button>
        </div>
        <button class="btn btn-danger btn-sm btn-full" id="resetDataBtn">${esc(t("resetAll"))}</button>
      </div>
      <div class="brand-credit">${esc(t("byDiamond"))}</div>
    `;

    drawColorWheel();

    body.querySelectorAll("[data-set-lang]").forEach(b => {
      b.onclick = () => {
        s.lang = b.dataset.setLang;
        saveState();
        applyTheme();
        renderSettings();
        renderAll();
        if (state.activeWorkout) renderFocusBody();
      };
    });
    body.querySelectorAll("[data-set-surf]").forEach(b => {
      b.onclick = () => { s.surface = b.dataset.setSurf; saveState(); applyTheme(); renderSettings(); };
    });
    body.querySelectorAll("[data-set-font]").forEach(b => {
      b.onclick = () => { s.font = b.dataset.setFont; saveState(); applyTheme(); renderSettings(); };
    });
    body.querySelectorAll("[data-preset-c]").forEach(d => {
      d.onclick = () => { s.accent = d.dataset.presetC; saveState(); applyTheme(); renderSettings(); };
    });
    const hexInp = body.querySelector("#hexInput");
    hexInp.oninput = () => {
      if (/^#[0-9a-fA-F]{6}$/.test(hexInp.value)) {
        s.accent = hexInp.value;
        document.getElementById("hexPreview").style.background = s.accent;
        saveState(); applyTheme();
      }
    };
    body.querySelectorAll("[data-set-unit]").forEach(b => {
      b.onclick = () => { s.unit = b.dataset.setUnit; saveState(); renderSettings(); renderAll(); };
    });
    const rSlider = body.querySelector("#restSlider");
    rSlider.oninput = () => {
      s.restSec = Number(rSlider.value);
      document.getElementById("restSliderVal").textContent = formatRest(s.restSec);
      saveState();
    };
    body.querySelectorAll("[data-toggle-s]").forEach(sw => {
      sw.onclick = () => {
        const k = sw.dataset.toggleS;
        s[k] = !s[k];
        saveState(); applyTheme(); renderSettings(); renderStats();
      };
    });

    body.querySelector("#exportCsvBtn").onclick = exportWorkoutsCSV;
    body.querySelector("#exportJsonBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `barstats-backup-${todayStr()}.json`;
      a.click(); URL.revokeObjectURL(url);
    };
    body.querySelector("#copyJsonBtn").onclick = async () => {
      try {
        await navigator.clipboard.writeText(JSON.stringify(state, null, 2));
        showPRToast(t("toastCopied"));
      } catch (e) { showPRToast(t("toastCopyFail")); }
    };
    body.querySelector("#importFileBtn").onclick = () => document.getElementById("jsonFileInput").click();
    body.querySelector("#pasteJsonBtn").onclick = () => {
      openModal(`
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">${esc(t("pasteTitle"))}</div>
        <textarea class="input mono" id="pasteArea" rows="6" placeholder='{"settings":...}'></textarea>
        <button class="btn btn-primary btn-full" style="margin-top:10px" id="doPasteBtn">${esc(t("restoreBackup"))}</button>
      `);
      document.getElementById("doPasteBtn").onclick = () => {
        importJsonString(document.getElementById("pasteArea").value);
        closeModal();
      };
    };
    body.querySelector("#seedDemoBtn").onclick = () => {
      seedDemoHistory();
      saveState();
      renderAll();
      showPRToast(t("toastDemo"));
    };
    body.querySelector("#resetDataBtn").onclick = () => {
      openModal(`
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">${esc(t("resetTitle"))}</div>
        <div class="muted" style="margin-bottom:16px">${esc(t("resetMsg"))}</div>
        <div class="grid-2">
          <button class="btn btn-ghost" id="cReset">${esc(t("cancel"))}</button>
          <button class="btn btn-danger" id="yReset">${esc(t("reset"))}</button>
        </div>
      `);
      document.getElementById("cReset").onclick = closeModal;
      document.getElementById("yReset").onclick = () => {
        state.workouts = [];
        state.bodyweights = [];
        state.activeWorkout = null;
        state.exercises = DEFAULT_EXERCISES.slice();
        state.templates = DEFAULT_TEMPLATES.slice();
        saveState();
        closeModal();
        renderAll();
      };
    };
  }

  function drawColorWheel() {
    const canvas = document.getElementById("colorWheelCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const r = canvas.width / 2;
    for (let angle = 0; angle < 360; angle++) {
      const start = (angle - 1) * Math.PI / 180;
      const end = (angle + 1) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(r, r);
      ctx.arc(r, r, r, start, end);
      ctx.closePath();
      const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(1, `hsl(${angle}, 90%, 55%)`);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    function pick(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = Math.max(0, Math.min(canvas.width - 1, Math.floor((clientX - rect.left) * (canvas.width / rect.width))));
      const y = Math.max(0, Math.min(canvas.height - 1, Math.floor((clientY - rect.top) * (canvas.height / rect.height))));
      const d = ctx.getImageData(x, y, 1, 1).data;
      const hex = "#" + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, "0")).join("");
      state.settings.accent = hex;
      saveState(); applyTheme();
      const hi = document.getElementById("hexInput");
      const hp = document.getElementById("hexPreview");
      if (hi) hi.value = hex;
      if (hp) hp.style.background = hex;
    }
    let dragging = false;
    canvas.onmousedown = e => { dragging = true; pick(e); };
    canvas.onmousemove = e => { if (dragging) pick(e); };
    window.addEventListener("mouseup", () => { dragging = false; });
    canvas.ontouchstart = e => { e.preventDefault(); pick(e); };
    canvas.ontouchmove = e => { e.preventDefault(); pick(e); };
  }

  function importJsonString(str) {
    try {
      const parsed = JSON.parse(str);
      if (!parsed || typeof parsed !== "object") throw new Error("Invalid");
      state = {
        settings: Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {}),
        exercises: Array.isArray(parsed.exercises) && parsed.exercises.length ? parsed.exercises : DEFAULT_EXERCISES.slice(),
        templates: Array.isArray(parsed.templates) ? parsed.templates : DEFAULT_TEMPLATES.slice(),
        workouts: Array.isArray(parsed.workouts) ? parsed.workouts : [],
          bodyweights: Array.isArray(parsed.bodyweights) ? parsed.bodyweights : [],
        activeWorkout: parsed.activeWorkout || null
      };
      saveState(); applyTheme(); renderAll(); renderSettings();
      showPRToast(t("toastRestored"));
    } catch (e) {
      showPRToast(t("toastInvalid"));
    }
  }

  document.getElementById("jsonFileInput").onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importJsonString(reader.result);
    reader.readAsText(file);
    e.target.value = "";
  };

  function seedDemoHistory() {
    const demo = [];
    const plan = [
      { name: "Push", exs: [["ex_bench", 75, 8], ["ex_incline_db", 26, 10], ["ex_ohp", 45, 8], ["ex_pushdown", 25, 12]] },
      { name: "Pull", exs: [["ex_pullup", 10, 8], ["ex_bb_row", 65, 8], ["ex_cable_row", 55, 10], ["ex_bb_curl", 30, 10]] },
      { name: "Legs", exs: [["ex_squat", 95, 6], ["ex_rdl", 80, 8], ["ex_leg_press", 140, 10], ["ex_calf", 60, 15]] }
    ];
    for (let i = 14; i >= 1; i--) {
      const dayOff = i * 3;
      const p = plan[i % 3];
      const prog = Math.floor((14 - i) / 3) * 2.5;
      demo.push({
        id: uid("demo"),
        name: p.name,
        date: daysAgoStr(dayOff),
        durationSec: 2700 + (i % 4) * 300,
        exercises: p.exs.map(([id, baseW, reps], idx) => ({
          exId: id,
          supersetWithNext: idx === 2,
          sets: [
            { kg: Math.max(10, baseW * 0.6), reps: 8, tag: "W" },
            { kg: baseW + prog, reps, tag: "" },
            { kg: baseW + prog, reps, tag: "" },
            { kg: baseW + prog, reps: Math.max(5, reps - 1), tag: idx === 0 ? "F" : "" }
          ]
        }))
      });
    }
    state.workouts = demo;
    const demoBw = [];
    for (let i = 20; i >= 0; i--) {
      const trend = 74.0 - (20 - i) * 0.06 + ((i % 3) - 1) * 0.25;
      demoBw.push({ date: daysAgoStr(i), kg: Math.round(trend * 10) / 10 });
    }
    state.bodyweights = demoBw;
  }

  document.getElementById("openSettingsBtn").onclick = () => {
    renderSettings();
    document.getElementById("settingsDrawer").classList.add("open");
  };
  document.getElementById("closeSettingsBtn").onclick = () => {
    document.getElementById("settingsDrawer").classList.remove("open");
  };

  /* ==================== INIT ==================== */
  function renderAll() {
    renderTrain();
    renderStats();
    renderLibrary();
  }

  try {
    applyTheme();
    initNativeBackButton();
    renderAll();
    if (state.activeWorkout) startSessionClock();
  } catch (err) {
    console.error("Barstats init error:", err);
  }
  setTimeout(() => {
    const sp = document.getElementById("appSplash");
    if (sp) sp.classList.add("hide");
  }, 1100);
})();
</script>
